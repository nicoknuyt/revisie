<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Revisiecontrole KPS</title>
<style>
:root{--bg:#f4f5f7;--kaart:#fff;--tekst:#1b1f24;--zacht:#5b6470;--rand:#d9dde3;
  --ok:#137a3a;--ok-bg:#e6f4ea;--nok:#b3261e;--nok-bg:#fde8e6;--wacht:#8a5a00;--wacht-bg:#fff4dc}
@media (prefers-color-scheme:dark){:root{--bg:#121417;--kaart:#1c1f24;--tekst:#eef0f3;--zacht:#a3abb6;--rand:#30353c;
  --ok:#5fd38a;--ok-bg:#16301f;--nok:#ff8a80;--nok-bg:#3a1714;--wacht:#ffc861;--wacht-bg:#33280f}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tekst);font:17px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:520px;margin:0 auto;padding:20px 16px 32px}
.kop{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--zacht);margin:4px 0 14px}
.status{border-radius:14px;padding:22px 20px;border:2px solid;margin-bottom:16px}
.status.ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.status.nok{background:var(--nok-bg);border-color:var(--nok);color:var(--nok)}
.status.wacht{background:var(--wacht-bg);border-color:var(--wacht);color:var(--wacht)}
.status h1{margin:0 0 6px;font-size:26px;line-height:1.2}
.status p{margin:0;color:var(--tekst)}
.fr{font-size:14px;color:var(--zacht);margin-top:8px!important}
.kaart{background:var(--kaart);border:1px solid var(--rand);border-radius:14px;padding:6px 16px}
.rij{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--rand)}
.rij:last-child{border-bottom:0}
.rij span{color:var(--zacht)}
.rij b{text-align:right;font-variant-numeric:tabular-nums}
.voet{font-size:13px;color:var(--zacht);margin-top:18px}
</style>
</head>
<body>
<main>
  <div class="kop">Knuyt Pipeline Services &middot; revisiecontrole</div>
  <div id="status" class="status wacht"><h1>Even geduld&hellip;</h1><p>De laatste revisie wordt opgezocht.</p></div>
  <div id="details" class="kaart" hidden></div>
  <p class="voet" id="voet"></p>
</main>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const q = new URLSearchParams(location.search);
const code = (q.get('c') || '').trim().toUpperCase();
const geprint = (q.get('r') || '').trim().toUpperCase();
const revNr = r => { const m = /^R?(\d+)$/i.exec(r || ''); return m ? +m[1] : NaN; };

function toon(soort, titel, tekst, fr, rijen) {
  const s = $('#status');
  s.className = 'status ' + soort;
  s.innerHTML = `<h1>${titel}</h1><p>${tekst}</p>${fr ? `<p class="fr">${fr}</p>` : ''}`;
  if (rijen && rijen.length) {
    const d = $('#details');
    d.innerHTML = rijen.map(([k, v]) => `<div class="rij"><span>${esc(k)}</span><b>${esc(v)}</b></div>`).join('');
    d.hidden = false;
  }
}

async function start() {
  if (!code) {
    toon('wacht', 'Geen tekening gekozen', 'Scan de QR-code op de tekening om de laatste revisie te zien.',
         'Scannez le code QR sur le plan pour voir la dernière révision.');
    return;
  }
  let data;
  try {
    const r = await fetch('revisies.json?t=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) throw new Error(r.status);
    data = await r.json();
  } catch (e) {
    toon('wacht', 'Niet bereikbaar', 'De revisielijst kon niet geladen worden. Controleer de internetverbinding en scan opnieuw.',
         'Liste des révisions indisponible. Vérifiez la connexion et réessayez.');
    return;
  }
  const t = (data.codes || {})[code];
  if (!t) {
    toon('wacht', 'Onbekende tekening', 'Deze code staat niet in de revisielijst. Vraag bij KPS na welke versie geldig is.',
         'Plan inconnu. Demandez à KPS quelle version est valable.', [['Code', code]]);
    return;
  }
  const rijen = [['Tekening', t.t], ['Laatste revisie', t.r], ['Datum laatste revisie', t.d || '–']];
  if (!geprint) {
    toon('wacht', `Laatste revisie: ${esc(t.r)}`, 'Vergelijk met het revisienummer in het titelkader van uw afdruk.',
         `Dernière révision : ${esc(t.r)}.`, rijen);
  } else if (revNr(geprint) === revNr(t.r)) {
    rijen.splice(1, 0, ['Uw afdruk', geprint]);
    toon('ok', `&#10003; Actueel: ${esc(t.r)}`, 'Deze afdruk is de laatste revisie. U mag ermee werken.',
         'Ce plan est la dernière révision.', rijen);
  } else {
    rijen.splice(1, 0, ['Uw afdruk', geprint]);
    toon('nok', '&#9888; Verouderde tekening', `Deze afdruk is <b>${esc(geprint)}</b>, maar de laatste revisie is <b>${esc(t.r)}</b>. Niet mee werken: vraag de nieuwe tekening op.`,
         `Plan périmé (${esc(geprint)}). Dernière révision : ${esc(t.r)}. Ne pas utiliser.`, rijen);
  }
  if (data.bijgewerkt) $('#voet').textContent = 'Revisielijst bijgewerkt op ' + data.bijgewerkt + '.';
}
start();
</script>
</body>
</html>
